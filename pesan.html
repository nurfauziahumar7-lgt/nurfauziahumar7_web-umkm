<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Martabak & Terang Bulan APPA - Pesan</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid nav-container">

            <div class="logo">
                <img src="logo APPA.png" alt="Logo APPA">
                <span>Martabak & Terang Bulan APPA</span>
            </div>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse justify-content-end"
                id="navbarNav">

                <ul class="navbar-nav gap-lg-2">

                    <li class="nav-item">
                        <a href="index.html" class="nav-link page-link">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="menu.html" class="nav-link page-link">
                            Menu
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="pesan.html" class="nav-link page-link">
                            Pesan
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="pelanggan.html" class="nav-link page-link">
                            Pelanggan
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="header">
        <h1>🛒 PESANAN</h1>
        <p>Periksa menu dan masukkan nama pelanggan</p>
    </div>

    <!-- Container -->
    <div class="container">

        <!-- Nama Pelanggan -->
        <div class="nama-pelanggan">

            <label for="nama">
                👤 Nama Pelanggan
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama pelanggan"
            >
        </div>

        <!-- Daftar Pesanan -->
        <div id="daftarPesanan"></div>

        <!-- Total -->
        <div class="total">
            <span>TOTAL</span>

            <span id="totalHarga">
                Rp0
            </span>
        </div>

        <!-- Simpan Pesanan -->
        <button
            class="simpan"
            onclick="simpanPesanan()">

            ✅ Simpan Pesanan
        </button>
    </div>

    <!-- Footer -->
    <footer>
        © 2026 Martabak & Terang Bulan APPA
    </footer>

    <!-- JavaScript Pesanan -->
    <script>

        // Menampilkan pesanan dari local storage
        function tampilkanPesanan() {

            let pesanan =
                JSON.parse(
                    localStorage.getItem("pesanan")
                ) || [];

            let daftar =
                document.getElementById("daftarPesanan");

            let total =
                document.getElementById("totalHarga");

            daftar.innerHTML = "";

            let totalHarga = 0;

            // Jika belum ada pesanan
            if (pesanan.length === 0) {

                daftar.innerHTML = `
                    <div class="kosong">
                        <h2>
                            Belum ada menu
                        </h2>

                        <p>
                            Silakan pilih menu terlebih dahulu.
                        </p>
                    </div>
                `;
                total.textContent = "Rp0";
                return;
            }

            // Menampilkan setiap pesanan
            pesanan.forEach((item, index) => {

                let subtotal =
                    item.harga * item.jumlah;

                totalHarga += subtotal;

                daftar.innerHTML += `
                    <div class="order-item">

                        <strong>
                            ${item.nama}
                        </strong>

                        <span class="harga">
                            Rp${item.harga.toLocaleString("id-ID")}
                        </span>

                        <div class="jumlah">

                            <button
                                onclick="kurangi(${index})">
                                −
                            </button>

                            <strong>
                                ${item.jumlah}
                            </strong>

                            <button
                                onclick="tambah(${index})">
                                +
                            </button>

                        </div>

                        <div>
                            <strong>
                                Rp${subtotal.toLocaleString("id-ID")}
                            </strong>

                            <br><br>

                            <button
                                class="hapus"
                                onclick="hapusItem(${index})">
                                Hapus
                            </button>
                        </div>

                    </div>
                `;
            });

            // Menampilkan total harga
            total.textContent =
                "Rp" + totalHarga.toLocaleString("id-ID");
        }

        // Menambah jumlah pesanan
        function tambah(index) {

            let pesanan =
                JSON.parse(
                    localStorage.getItem("pesanan")
                ) || [];

            if (!pesanan[index]) {
                return;
            }

            pesanan[index].jumlah++;

            localStorage.setItem(
                "pesanan",
                JSON.stringify(pesanan)
            );

            tampilkanPesanan();
        }

        // Mengurangi jumlah pesanan
        function kurangi(index) {

            let pesanan =
                JSON.parse(
                    localStorage.getItem("pesanan")
                ) || [];

            if (!pesanan[index]) {
                return;
            }

            pesanan[index].jumlah--;

            if (pesanan[index].jumlah <= 0) {
                pesanan.splice(index, 1);
            }

            localStorage.setItem(
                "pesanan",
                JSON.stringify(pesanan)
            );

            tampilkanPesanan();
        }

        // Menghapus item pesanan
        function hapusItem(index) {

            let pesanan =
                JSON.parse(
                    localStorage.getItem("pesanan")
                ) || [];

            pesanan.splice(index, 1);

            localStorage.setItem(
                "pesanan",
                JSON.stringify(pesanan)
            );

            tampilkanPesanan();
        }

        // Menyimpan pesanan ke database
        async function simpanPesanan() {
            let nama =
                document
                    .getElementById("nama")
                    .value
                    .trim();

            let pesanan =
                JSON.parse(
                    localStorage.getItem("pesanan")
                ) || [];

            // Cek nama pelanggan
            if (nama === "") {

                alert(
                    "Masukkan nama pelanggan terlebih dahulu!"
                );
                return;
            }

            // Cek daftar pesanan
            if (pesanan.length === 0) {

                alert(
                    "Belum ada menu yang dipilih!"
                );
                return;
            }

            // Mengirim data ke simpan_pesanan.php
            try {
                const response = await fetch(
                    "simpan_pesanan.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nama: nama,
                            pesanan: pesanan
                        })
                    }
                );

                // Mengambil hasil dari PHP
                const hasil = await response.json();

                // Jika pesanan berhasil disimpan
                if (hasil.status) {

                    // Menghapus keranjang sementara
                    localStorage.removeItem("pesanan");

                    alert(
                        "Pesanan " + nama + " berhasil disimpan!"
                    );

                    // Berpindah ke halaman pelanggan
                    window.location.href = "pelanggan.html";

                } else {

                    // Jika penyimpanan gagal
                    alert(
                        hasil.pesan ||
                        "Pesanan gagal disimpan."
                    );
                }

            } catch (error) {

                // Jika gagal terhubung ke PHP
                console.error("Error:", error);

                alert(
                    "Gagal terhubung ke server.\n\n" +
                    "Pastikan Apache dan MySQL " +
                    "di XAMPP sudah aktif."
                );
            }
        }

        // Menjalankan fungsi saat halaman dibuka
        tampilkanPesanan();

    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Efek pada input nama pelanggan -->
    <script>

        $(function () {

            $("#nama").on("focus", function () {

                $(this).css(
                    "border",
                    "2px solid #ffd04a"
                );
            });

            $("#nama").on("blur", function () {

                $(this).css(
                    "border",
                    "1px solid #d8c1a8"
                );
            });
        });
    </script>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYWjRrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
</body>
</html>
